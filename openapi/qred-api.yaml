openapi: 3.0.3
info:
  title: Qred API
  version: 1.0.0
  description: |
    This OpenAPI document is the single source of truth for the mobile dashboard
    shown in the product design. It is intended to be reviewed collaboratively by
    Backend, Frontend, and Product before implementation starts.
servers:
  - url: http://0.0.0.0:4010
    description: Mock Server
  - url: http://0.0.0.0:3000
    description: Development
tags:
  - name: Companies
    description: Company context and selector data.
  - name: Dashboard
    description: Aggregated dashboard data for the selected company.
  - name: Cards
    description: Card-specific actions.
  - name: Transactions
    description: Transaction history and pagination.

security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Health check
      description: Returns 200 if the service is up.
      tags: [Health]
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/v1/dashboard:
    $ref: "./paths/dashboard.yaml#/~1api~1v1~1dashboard"
  /api/v1/companies/{companyId}/card/default:
    $ref: "./paths/cards.yaml#/~1api~1v1~1companies~1{companyId}~1card~1default"
  /api/v1/companies:
    $ref: "./paths/companies.yaml#/~1api~1v1~1companies"
  /api/v1/user/company-selection:
    $ref: "./paths/companies.yaml#/~1api~1v1~1user~1company-selection"
  /api/v1/companies/{companyId}/invoices/latest:
    $ref: "./paths/company-resources.yaml#/~1api~1v1~1companies~1{companyId}~1invoices~1latest"
  /api/v1/companies/{companyId}/remaining-spend:
    $ref: "./paths/company-resources.yaml#/~1api~1v1~1companies~1{companyId}~1remaining-spend"
  /api/v1/companies/{companyId}/cards/{cardId}:
    $ref: "./paths/cards.yaml#/~1api~1v1~1companies~1{companyId}~1cards~1{cardId}"
  /api/v1/companies/{companyId}/cards/{cardId}/block:
    $ref: "./paths/cards.yaml#/~1api~1v1~1companies~1{companyId}~1cards~1{cardId}~1block"
  /api/v1/companies/{companyId}/cards/{cardId}/unblock:
    $ref: "./paths/cards.yaml#/~1api~1v1~1companies~1{companyId}~1cards~1{cardId}~1unblock"
  /api/v1/companies/{companyId}/cards/{cardId}/activate:
    $ref: "./paths/cards.yaml#/~1api~1v1~1companies~1{companyId}~1cards~1{cardId}~1activate"
  /api/v1/companies/{companyId}/transactions:
    $ref: "./paths/transactions.yaml#/~1api~1v1~1companies~1{companyId}~1transactions"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CompanyId:
      $ref: "./components/parameters.yaml#/CompanyId"
    CardId:
      $ref: "./components/parameters.yaml#/CardId"
    Cursor:
      $ref: "./components/parameters.yaml#/Cursor"
    PageSize:
      $ref: "./components/parameters.yaml#/PageSize"
