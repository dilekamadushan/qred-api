BaseProblemDetails:
  type: object
  required: [type, title, status, detail, requestId, code]
  properties:
    type:
      type: string
      format: uri
      example: https://api.qred.example.com/problems/error
    title:
      type: string
      example: Request failed
    status:
      type: integer
      minimum: 400
      maximum: 599
    detail:
      type: string
      example: The request could not be completed.
    instance:
      type: string
      format: uri
      nullable: true
    requestId:
      type: string
      example: req_123456
    code:
      type: string
      example: bad_request
    errors:
      type: array
      nullable: true
      items:
        $ref: "#/InvalidField"

InvalidField:
  type: object
  required: [field, reason]
  properties:
    field:
      type: string
      example: query.pageSize
    reason:
      type: string
      example: Must be greater than or equal to 1.

BadRequestProblemDetails:
  allOf:
    - $ref: "#/BaseProblemDetails"
    - type: object
      properties:
        type:
          type: string
          example: https://api.qred.example.com/problems/validation-error
        title:
          type: string
          example: VALIDATION_ERROR
        status:
          type: integer
          enum: [400]
        detail:
          type: string
          example: request/query/pageSize must be greater than or equal to 1
        code:
          type: string
          enum: [VALIDATION_ERROR, validation_error, format.openapi.validation]
          example: VALIDATION_ERROR
      example:
        type: https://api.qred.example.com/problems/validation-error
        title: VALIDATION_ERROR
        status: 400
        detail: request/query/pageSize must be greater than or equal to 1
        instance: https://api.qred.example.com/api/v1/companies?pageSize=0
        requestId: req_123456
        code: VALIDATION_ERROR
        errors:
          - field: query.pageSize
            reason: Must be greater than or equal to 1.

