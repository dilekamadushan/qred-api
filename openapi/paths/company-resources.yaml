

/api/v1/companies/{companyId}/invoices/latest:
  get:
    tags: [Dashboard]
    operationId: getLatestInvoice
    summary: Get the latest due invoice for a company.
    description: Returns the latest (most recent, unpaid) invoice for the given company.
    parameters:
      - $ref: "../components/parameters.yaml#/CompanyId"
    responses:
      "200":
        description: Latest due invoice details returned.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/InvoiceDue"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

/api/v1/companies/{companyId}/remaining-spend:
  get:
    tags: [Dashboard]
    operationId: getCompanyRemainingSpend
    summary: Get remaining spend details for the selected company.
    description: Returns the remaining spend section with detailed breakdown for the selected company.
    parameters:
      - $ref: "../components/parameters.yaml#/CompanyId"
    responses:
      "200":
        description: Remaining spend details returned.
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/RemainingSpendSummary"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "401":
        $ref: "../components/responses.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/InternalServerError"
